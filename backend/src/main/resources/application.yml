server:
  port: 8080

spring:
  application:
    name: portfolio-backend
  datasource:
    url: jdbc:h2:file:./data/portfolio-contacts;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Configuracoes proprias da aplicacao (portfolio.*), ligadas em PortfolioProperties.
portfolio:
  allowed-origins:
    - https://artfrc.github.io
    - http://localhost:5500
    - http://127.0.0.1:5500
    - http://localhost:3000
  admin-api-key: ${PORTFOLIO_ADMIN_KEY:changeme-local-key}
  rate-limit:
    max-requests: 5
    window-seconds: 60
  # Sem essas duas vars, o app cai automaticamente no LoggingContactNotifier
  # (so loga a mensagem nova, nao manda nada) — veja backend/README.md para
  # o passo a passo de criar o bot e pegar o chat-id.
  telegram:
    bot-token: ${PORTFOLIO_TELEGRAM_BOT_TOKEN:}
    chat-id: ${PORTFOLIO_TELEGRAM_CHAT_ID:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
