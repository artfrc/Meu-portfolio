# Blueprint do Render (https://render.com/docs/blueprint-spec) pro backend do
# portfólio. Em render.com > New > Blueprint, aponte pra este repo e ele detecta
# este arquivo. Os três env vars marcados "sync: false" são secrets — preencha
# no dashboard do Render depois que o serviço for criado, nunca aqui.
services:
  - type: web
    name: artfrc-portfolio-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORTFOLIO_TELEGRAM_BOT_TOKEN
        sync: false
      - key: PORTFOLIO_TELEGRAM_CHAT_ID
        sync: false
      - key: PORTFOLIO_ADMIN_KEY
        sync: false
